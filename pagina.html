</style></head><body>
<header><div class="wrap"><button class="perfil" id="perfilBtn" hidden aria-label="O meu perfil"></button><button class="perfil" id="menuBtn" hidden aria-label="Menu de gestão">☰</button><div class="logo" id="logo" hidden><img id="logoImg" alt="Dragon Padel Boa Vida"></div><div class="clube" id="clube">Dragon Padel · Boa Vida</div><h1><span id="nomeLiga">Liga Dragon</span><span class="bola"></span></h1><div class="sub" id="sub">A carregar…</div></div></header>
<nav><div class="wrap" id="tabs"></div></nav>
<main><div class="wrap" id="app"><div class="card"><span class="mut">A carregar a liga…</span></div></div></main>
<div id="toast" hidden></div>
<div id="prog" hidden role="status" aria-live="polite"><div class="pcard"><b id="progT"></b><div class="barra"><i id="progB"></i></div><span class="small mut" id="progS"></span></div></div>
<div id="gaveta" hidden><button class="fundo" data-fechar="1" aria-label="Fechar menu"></button><div class="painel" id="painel"></div></div>
<script>
const P=location.pathname.split('/').filter(Boolean);const T=(P[0]==='j'||P[0]==='admin')?P[1]:'';
let S=null,tab='tabela',jor=null,abertos={},catV=null;
const catDe=id=>((S.jogadores.find(p=>p.id===id)||{}).cat==='F'?'F':'M');
const temFem=()=>S.jogadores.some(p=>p.ativo&&p.cat==='F');
const tabCat=c=>(S._tab||S.tabela).filter(r=>catDe(r.id)===c);
function aplicarCat(){if(!S._tab){S._tab=S.tabela;S._ant=S.ant}if(!catV)catV=S.me?S.me.cat:'M';if(!temFem())catV='M';S.tabela=tabCat(catV);S.ant=S._ant?S._ant.filter(id=>catDe(id)===catV):null}
const NIVS=['masters','pro','sarrabeco'],NN={masters:'Masters',pro:'Pro',sarrabeco:'Sarrabeco'};
function nivDe(id){const t=tabCat(catDe(id)).filter(r=>S.jogadores.find(p=>p.id===r.id&&p.ativo));if(t.some(r=>r.j)){const i=t.findIndex(r=>r.id===id);if(i>=0)return i<8?'masters':i<16?'pro':'sarrabeco'}return (S.jogadores.find(p=>p.id===id)||{}).nivel||'sarrabeco'}
const tabNiv=n=>S.tabela.filter(r=>nivDe(r.id)===n);
const selNiv=(id,a)=>`<select id="${id}">${NIVS.map(n=>`<option value="${n}" ${n===(a||'sarrabeco')?'selected':''}>${NN[n]}</option>`).join('')}</select>`;
function gtxt(g){if(g.criado_por!==0)return '';const dv=g.divisao||(catDe(g.a1)+':');const ct=dv[0],nv=dv.split(':')[1];const gs=S.jogos.filter(x=>x.jornada===g.jornada&&x.criado_por===0&&(x.divisao||(catDe(x.a1)+':'))===dv).sort((a,b)=>a.id-b.id);const n=gs.findIndex(x=>x.id===g.id)+1;
  return [ct==='F'&&temFem()?'Feminino':'',NN[nv]||'',n&&(gs.length>1||!nv)?'Grupo '+n:''].filter(Boolean).join(' · ')}
const selFis=(id,X)=>`<select id="${id}">${[['','Automático (pela altura e peso)'],['magro','Magro'],['atletico','Atlético'],['barriguinha','Com barriguinha'],['gordinho','Gordinho'],['forte','Forte / musculado']].map(([k,t])=>`<option value="${k}" ${(X||'')===k?'selected':''}>${t}</option>`).join('')}</select>`;
const selCat=(id,a)=>`<select id="${id}"><option value="M" ${a!=='F'?'selected':''}>Masculino</option><option value="F" ${a==='F'?'selected':''}>Feminino</option></select>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jg=id=>S.jogadores.find(p=>p.id===id)||{nome:'?',lado:''};
const nome=id=>jg(id).nome;
const LN={D:'Direita',E:'Esquerda',A:'Os dois lados'};
const av=id=>{const f=(S.fotos||[]).find(x=>x.jogador===id);return f&&f.cari?`<img class="av" src="/cari/${id}?v=${encodeURIComponent(f.cari)}" alt="">`:''};
const nl=id=>{const l=jg(id).lado;return av(id)+esc(nome(id))+(l?`<span class="ld" title="${LN[l]}">${l==='A'?'D/E':l}</span>`:'')};
const DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const fd=d=>{const x=new Date(d+'T00:00:00Z');return DS[x.getUTCDay()]+' '+d.slice(8,10)+'/'+d.slice(5,7)};
const fdc=d=>d.slice(8,10)+'/'+d.slice(5,7);
const sorteada=n=>S.sorteados.includes(n);
const ausentes=n=>S.ausencias.filter(a=>a.jornada===n).map(a=>a.jogador);
let tt;function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'e':'';t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}
async function load(){try{const r=await fetch('/api/estado?t='+encodeURIComponent(T));S=await r.json();if(jor==null)jor=S.atual;render()}catch(e){$('#app').innerHTML='<div class="card">Sem ligação. Tenta outra vez.</div>'}}
async function acao(o){try{const r=await fetch('/api/acao',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({t:T,...o})});const d=await r.json();if(d.erro){toast(d.erro,1);return false}S=d.estado;abertos={};render();toast(d.msg);return true}catch(e){toast('Sem ligação. Tenta outra vez.',1);return false}}
function render(){
  aplicarCat();
  $('#nomeLiga').textContent=S.cfg.nome;$('#clube').textContent=S.cfg.clube;document.title=S.cfg.nome;
  if(S.cfg.logo){$('#logo').hidden=false;$('#logoImg').src='/logo?v='+S.cfg.logo;$('#clube').hidden=true}else{$('#logo').hidden=true;$('#clube').hidden=false}
  const pb=$('#perfilBtn');if(S.me){pb.hidden=false;const f=(S.fotos||[]).find(x=>x.jogador===S.me.id);const html=f&&f.cari?`<img src="/cari/${S.me.id}?v=${encodeURIComponent(f.cari)}" alt="">`:f&&f.foto?`<img src="/foto/${S.me.id}?t=${T}&v=${f.fv}" alt="">`:esc(S.me.nome.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase());if(pb.dataset.h!==html){pb.innerHTML=html;pb.dataset.h=html}}else pb.hidden=true;
  const [a,b]=S.intervalos[S.atual-1];
  $('#sub').textContent=(S.hoje<S.cfg.inicio?'Arranca a '+fdc(S.cfg.inicio)+' · ':'')+'Jornada '+S.atual+' de '+S.cfg.jornadas+' · '+fdc(a)+' a '+fdc(b);
  const tabs=[];if(S.me||S.admin)tabs.push(['eu',S.admin&&!S.me?'Organizar':'O meu painel']);
  if(S.me)tabs.push(['perfil','👤 O meu perfil']);
  tabs.push(['tabela','Classificação'],['jornada','Jornadas'],['apostas','Apostas'],['rivais','Rivais'],['resultados','Resultados'],['regras','Regras']);
  $('#menuBtn').hidden=!S.admin;
  if(S.admin){const it=(k,l)=>`<button class="it ${tab===k?'on':''}" data-tab="${k}">${l}</button>`;
    $('#painel').innerHTML=`<div class="topo"><b>Gestão</b><button class="btn" data-fechar="1">Fechar</button></div>
    ${it('eu','Organização e sorteio')}${it('marc','📋 Marcações no clube')}${it('convite','Convite para jogadores')}${it('admin','Jogadores e links')}${it('caris','Fotos e caricaturas')}${it('defs','Definições e logótipo')}
    <h4>A liga</h4>${it('tabela','Classificação')}${it('jornada','Jornadas')}${it('apostas','Apostas')}${it('rivais','Rivais')}${it('resultados','Resultados')}${it('regras','Regras')}
    <h4>Outros</h4><a class="it" href="/" target="_blank" rel="noopener">Ver a página pública</a>`}
  if(!render.ini){render.ini=1;if(S.me||S.admin)tab='eu'}
  if(!['perfil','admin','defs','convite','caris','marc'].includes(tab)&&!tabs.some(t=>t[0]===tab))tab=tabs[0][0];
  $('#tabs').innerHTML=tabs.map(([k,l])=>`<button class="${k===tab?'on':''}" data-tab="${k}">${l}</button>`).join('');
  $('#app').innerHTML=({marc:vMarc,convite:vConvite,caris:vCaris,defs:()=>MKD+vAdmin().split(MKD)[1],perfil:vPerfil,eu:()=>vEu()+vMural(),tabela:vTabela,jornada:vJornada,apostas:vApostas,rivais:vRivais,resultados:vRes,regras:vRegras,admin:()=>vAdmin().split(MKD)[0]})[tab]();bemVindo();bvAtual();qrEm('qrMe');
}
function vMarc(){const M=S.marc||{aceites:[],reservas:[]};
  const js=S.jogos.filter(g=>g.estado==='marcado'&&g.quando&&g.quando.slice(0,10)>=S.hoje).sort((a,b)=>a.quando<b.quando?-1:a.quando>b.quando?1:0);
  const quem=g=>{const a=M.aceites.filter(x=>x.jogo===g.id).pop();return a?(a.por?nome(a.por):'Organização')+' · acordo dos 4':'Organização'};
  const res=g=>M.reservas.find(x=>x.jogo===g.id&&x.quando===g.quando);
  const falta=js.filter(g=>!res(g)).length;
  const lin=g=>qTxt(g.quando)+(g.campo?' · Campo '+g.campo:'')+' · '+nome(g.a1)+' & '+nome(g.a2)+' x '+nome(g.b1)+' & '+nome(g.b2);
  const pend=js.filter(g=>!res(g));const txt=(pend.length?pend:js).map(lin).join('\n');
  const dias=[...new Set(js.map(g=>g.quando.slice(0,10)))];
  let h='<div class="card"><h2>📋 Marcações no clube</h2><div class="small mut">Jogos já marcados pelos jogadores, por dia e hora. Reserva os campos no clube e marca cada jogo como reservado. Se a hora mudar, o jogo volta a ficar por reservar.</div>';
  if(js.length)h+='<div class="small"><b>'+js.length+'</b> marcados · <b>'+falta+'</b> por reservar</div><div class="row"><button class="btn p" data-copiar="'+esc(txt)+'">Copiar '+(pend.length?'os por reservar':'a lista')+'</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent('Marcações Liga Dragon:\n'+txt)+'">Enviar no WhatsApp</a></div>';
  h+='</div>';
  if(!js.length)return h+'<div class="card"><div class="vazio">Ainda não há jogos marcados.</div></div>';
  return h+dias.map(d=>'<div class="card"><h3>'+qTxt(d+'T00:00').split(' às')[0]+'</h3>'+js.filter(g=>g.quando.slice(0,10)===d).map(g=>{const r=res(g);
    return '<div class="jogo"><div class="jh"><span class="quando">'+g.quando.slice(11,16)+(g.campo?' · Campo '+esc(g.campo):' · sem campo livre')+'</span><span class="sp"></span>'+grupoTag(g)+(r?'<span class="chip c-jogado">✅ Reservado</span>':'<span class="chip c-pm">⏳ Por reservar</span>')+'</div>'
    +'<div>'+esc(nome(g.a1))+' &amp; '+esc(nome(g.a2))+' <span class="mut">contra</span> '+esc(nome(g.b1))+' &amp; '+esc(nome(g.b2))+'</div><div class="small mut">Marcado por '+esc(quem(g))+'</div>'
    +'<div class="row">'+(r?'<button class="btn" data-acao="reservar" data-id="'+g.id+'">Desfazer reserva</button>':'<button class="btn p" data-acao="reservar" data-id="'+g.id+'" data-valor="1">Marcar como reservado</button>')+'</div></div>'}).join('')+'</div>').join('')}
function vTabela(){
  const sw=temFem()?`<div class="catsw">${[['M','Masculino'],['F','Feminino']].map(([k,n])=>`<button class="btn ${catV===k?'p':''}" data-cat="${k}">${n}</button>`).join('')}</div>`:'';
  const rows=S.tabela.filter(r=>S.jogadores.find(p=>p.id===r.id&&p.ativo));const nada=rows.every(r=>!r.j);const zona=i=>i<8?'masters':i<16?'pro':'sarrabeco';
  let h='';rows.forEach((r,i)=>{const z=zona(i);if(!nada&&(i===0||z!==zona(i-1)))h+=`<tr class="zn zn-${z}"><td colspan="8">${z==='masters'?'🏆 ':''}${NN[z]}<span>${z==='masters'?'1.º a 8.º':z==='pro'?'9.º a 16.º':'17.º em diante'}</span></td></tr>`;
    h+=`<tr class="${i<3&&r.j?'top':''} ${S.me&&S.me.id===r.id?'eu':''}"><td class="pos">${i+1}</td><td>${nl(r.id)}${seta(r.id)}</td><td>${r.j}</td><td>${r.v}</td><td>${r.d}</td><td>${r.gg>0?'+':''}${r.gg}</td><td class="pts">${r.pts}</td><td class="hide-s">${r.forma.map(f=>`<span class="f ${f}">${f}</span>`).join('')}</td></tr>`});
  return sw+jogoSemana()+podio()+`<div class="card"><div class="row"><h2>Classificação${temFem()?(catV==='F'?' feminina':' masculina'):''}</h2><span class="sp"></span><span class="small mut">Vitória ${S.cfg.pts_v} pts · Derrota ${S.cfg.pts_d} pt</span></div>
  ${nada?'<div class="small mut">Ainda não há resultados. Depois da 1.ª jornada, os 8 primeiros ficam Masters, do 9.º ao 16.º Pro e os restantes Sarrabeco.</div>':''}
  <div class="tw"><table class="tab"><thead><tr><th>#</th><th>Jogador</th><th>J</th><th>V</th><th>D</th><th title="Saldo de jogos">+/-</th><th>Pts</th><th class="hide-s">Forma</th></tr></thead><tbody>${h}</tbody></table></div>
  <div class="small mut">O nível sai da classificação: 1.º a 8.º Masters, 9.º a 16.º Pro, do 17.º para baixo Sarrabeco. Os grupos de cada semana fazem-se dentro do nível. Desempate: pontos, saldo de jogos, vitórias, saldo de sets.</div></div>`;
}
function estadoChip(g){const fim=S.intervalos[g.jornada-1][1];
  if(g.estado==='jogado')return g.sets==='W.O.'?'<span class="chip c-jogado">Falta de comparência</span>':'<span class="chip c-jogado">Jogado</span>';
  if(g.estado==='por confirmar')return '<span class="chip c-conf">Por confirmar</span>';
  if(fim<S.hoje)return '<span class="chip c-pm">Não realizado</span>';

function vRegras(){const c=S.cfg;return `<div class="card regras"><h2>Como funciona</h2><ol>
<li>A liga tem ${c.jornadas} jornadas de uma semana (segunda a domingo), a começar a ${fd(c.inicio)}. Cada jogador faz um jogo por jornada.</li>
<li>Todos os inscritos entram no sorteio. Quem não puder jogar numa semana carrega em "Não posso jogar" no seu link, até domingo.</li>
<li>Na segunda-feira às 00:05 a aplicação faz o sorteio: junta os jogadores em grupos de 4 do mesmo nível, pela classificação: o Grupo 1 com os primeiros, o Grupo 2 com os seguintes, e assim por diante (na primeira jornada, à sorte). Uma vitória vale o mesmo em qualquer grupo: quem ganha sobe, quem perde desce.</li>
<li>Cada dupla tem sempre um jogador de direita e um de esquerda. Quem joga dos dois lados encaixa em qualquer um. Ninguém repete parceiro enquanto houver parceiros novos possíveis. O sorteio também evita repetir adversários e equilibra as duplas.</li>
<li>Cada jogador escolhe no perfil 2 ou 3 horários preferidos. No sorteio, a app procura o horário comum dos quatro e marca sozinha o jogo e o campo. Se não houver horário comum, os quatro combinam e marcam na página. Todos os jogos são no ${esc(c.clube)}.</li>
<li>A Liga Dragon tem duas ligas, a masculina e a feminina, cada uma com a sua classificação e três níveis que saem dela: do 1.º ao 8.º lugar <b>Masters</b>, do 9.º ao 16.º <b>Pro</b>, do 17.º para baixo <b>Sarrabeco</b>.</li>
<li>Todas as segundas, o sorteio vê a classificação, põe cada jogador no seu nível e faz os grupos de 4 dentro de cada nível. Quem sobe na tabela sobe de nível; quem cai, desce. Se um nível tiver menos de 4 jogadores nessa semana, junta-se ao nível vizinho.</li>
<li>Os pontos são de cada jogador: vitória ${c.pts_v} pontos, derrota ${c.pts_d} ${c.pts_d===1?'ponto':'pontos'}. Na falta de comparência, quem faltou leva 0 e a dupla presente ganha.</li>
<li>Cada jogo é à <b>melhor de 3 sets</b>: cada set vai até 6 jogos, com tie-break aos 6-6. No 40-40 joga-se <b>ponto de ouro</b>: um só ponto decide o jogo e a dupla que recebe escolhe o lado.</li>
<li>Depois do jogo, um dos quatro lança o resultado e um jogador da outra dupla confirma. Sem confirmação em 48 horas, o resultado fica válido.</li>
<li>Se o número de jogadores não der grupos de 4, os que sobram ficam de folga e têm prioridade na jornada seguinte.</li>
<li>Jogo que não se faça até domingo, sem falta declarada, não conta para ninguém.</li>
<li><b>Multas:</b> depois de o jogo estar marcado, podes desmarcá-lo sem custos <b>até 12 horas antes</b>. Quem desmarcar mais tarde ou faltar <b>paga o custo completo do campo</b>. Repetir pode levar à <b>expulsão da liga</b>.</li>
<li><b>Marcar o jogo:</b> qualquer um dos 4 propõe uma hipótese de dia e hora e os outros respondem "Dá para mim" ou "Não dá". O jogo <b>só fica marcado quando os 4 concordarem</b>. Para combinar, usem o <b>💬 Chat dos 4</b> no cartão do jogo.</li>
<li><b>Não podes jogar esta semana?</b> No teu jogo carrega em <b>"Não posso · dar a vez"</b>: entra no teu lugar quem está de folga e tu ficas de folga. Os outros três são avisados.</li>
<li><b>Desafios:</b> no teu painel podes desafiar qualquer jogador da tua liga. Se ele aceitar, a app escolhe os parceiros, de nível parecido, e monta o jogo dessa semana. O desafio é um jogo extra: não conta para a classificação, mas conta para os Rivais e para as apostas, e as regras das multas aplicam-se na mesma.</li>

<li>Apostas a fingir, sem dinheiro real: cada jogador começa com 1000 dragões e aposta numa dupla dos jogos dos outros (nunca no seu), até à hora marcada. Quem acerta divide o bolo da dupla que perdeu, e a casa põe 100 dragões de cada lado. Se o jogo não se fizer, as apostas são devolvidas.</li></ol></div>`}

document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,k=f.dataset.form,id=+f.dataset.id,v=s=>(document.getElementById(s)||{}).value;const btn=f.querySelector('button');if(btn)btn.disabled=true;
  if(k==='chat'){await chatEnviar(id);if(btn&&btn.isConnected)btn.disabled=false;return}
  if(k==='marcar')await acao({acao:'marcar',a1:v('m_a1'),a2:v('m_a2'),b1:v('m_b1'),b2:v('m_b2'),jornada:v('m_j')});
  if(k==='resultado')await acao({acao:'resultado',id,sets:[0,1,2].map(i=>[v(`s${id}a${i}`),v(`s${id}b${i}`)])});
  if(k==='reagendar')await acao({acao:S.me?'propor':'reagendar',id,quando:v('rd'+id)+'T'+v('rh'+id)});
  if(k==='trocar')await acao({acao:'trocar',id,slot:v('ts'+id),entra:v('te'+id)});
  if(k==='apostar')await acao({acao:'apostar',id,lado:v('al'+id),valor:v('av'+id)});
  if(k==='disp')await acao({acao:'disp',slots:[0,1,2].map(i=>({d:+v('dd'+i),h:v('dh'+i)})).filter(s=>s.d&&s.h)});
  if(k==='perfil')await acao({acao:'perfil',lado:v('pfLado'),cat:v('pfCat'),telefone:v('pfTel'),email:v('pfEmail'),altura:v('pfAlt'),peso:v('pfPeso'),idade:v('pfIdade'),fisico:v('pfFis')});
  if(k==='lado')await acao({acao:'lado',lado:v('meuLado')});
  if(k==='add'){if(await acao({acao:'add_jogador',nome:v('novoNome'),lado:v('novoLado'),cat:v('novoCat')}))tab='admin'}
  if(k==='renomear')await acao({acao:'renomear',id,nome:v('rn'+id)});
  if(k==='ficha')await acao({acao:'ficha',jogador:id,nome:v('fn'+id),telefone:v('ft'+id),email:v('fe'+id),lado:v('fl'+id),cat:v('fc'+id),altura:v('fal'+id),peso:v('fp'+id),idade:v('fi'+id),fisico:v('ff'+id)});
  if(k==='config')await acao({acao:'config',nome:v('c_nome'),inicio:v('c_ini'),jornadas:v('c_jor'),pts_v:v('c_v'),pts_d:v('c_d'),campos:v('c_campos')});
  if(btn&&btn.isConnected)btn.disabled=false;
});
setInterval(async()=>{if(document.hidden||!S||!S.admin)return;try{const r=await fetch('/api/inscricoes?t='+encodeURIComponent(T));const d=await r.json();if(!d.lista)return;const k=JSON.stringify(d.lista);if(k===insUlt)return;const prim=!insUlt;const ant=new Map([...insDeS(),...(insLista||[])].map(x=>[x.id,x]));const novos=d.lista.filter(x=>!ant.has(x.id)||(!ant.get(x.id).telefone&&x.telefone));insUlt=k;insLista=d.lista;if(novos.length&&!prim)toast('🐉 '+(novos.length>1?novos.length+' novos inscritos: ':'Novo inscrito: ')+novos.map(x=>x.nome).join(', '));if(novos.length&&!Object.values(abertos).some(Boolean)&&!document.activeElement.matches('input,select,textarea')){load();return}const el=document.getElementById('painelIns');if(el)el.outerHTML=vPainelIns(insLista)}catch(_){}},8000);
setInterval(()=>{if(!document.hidden&&!chatAb&&!Object.values(abertos).some(Boolean)&&!document.activeElement.matches('input,select'))load()},60000);
try{if(P[0]==='j'&&T)localStorage.setItem('ldtok',T)}catch(_){}
let apFoco=+new URLSearchParams(location.search).get('aposta')||0;
if(P[0]==='aposta'){apFoco=+P[1]||0;let tk='';try{tk=localStorage.getItem('ldtok')||''}catch(_){}if(tk)location.replace('/j/'+tk+'?aposta='+apFoco)}
if(apFoco)tab='apostas';
function focarAposta(){if(!apFoco||!S)return;const f=document.querySelector('form[data-form="apostar"][data-id="'+apFoco+'"]');const el=f?(f.closest('.jogo')||f):null;
  if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='3px solid #d8e84a';el.style.outlineOffset='3px';apFoco=0}
  else if(!S.me){const a=document.getElementById('app');if(a&&!document.getElementById('apAviso'))a.insertAdjacentHTML('afterbegin','<div class="card" id="apAviso"><b>Para apostar, abre o teu link pessoal da liga.</b><div class="small mut">Se não o tens, pede-o ao organizador. Depois de o abrires uma vez neste telemóvel, os links dos cartazes levam-te direto à aposta.</div></div>');apFoco=0}}
const _renderLD=render;render=function(){_renderLD.apply(this,arguments);setTimeout(focarAposta,60)};if(apFoco)render.ini=1;
if(P[0]==='convite')convite();else load();
